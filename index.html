<title>Zarahi's Birthday Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,800&family=Playwrite+US+Trad:wght@300;400&display=swap">
<style>
/* Layout: one portrait card (1414:2000) whose pages stack and turn like a real card; a slim control bar sits under it.
   Single look on purpose: the saturated blue of the artwork, cream paper, pink and green accents.
   Moving pieces (letters, cats, balloons, heart) are separate transparent layers placed over a cleaned base image. */
:root {
  --blue: #2323c6;
  --blue-deep: #17178f;
  --cream: #fff6e6;
  --paper: #fbf8f2;
  --ink: #23202e;
  --pink: #f26ca7;
  --blush: #f9c6d4;
  --green: #5f8f3e;
  --orange: #ff6a00;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --script: 'Playwrite US Trad', 'Snell Roundhand', 'Segoe Script', 'Brush Script MT', cursive;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; background: var(--blue); color: var(--cream); font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; display: flex; align-items: center; justify-content: center; overflow-x: hidden;
}
.wrap {
  --avail: calc(100vh - 128px);
  --avail: calc(100dvh - 128px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  width: min(100%, 560px, calc(var(--avail) * 0.707));
  display: flex; flex-direction: column; gap: 12px;
}
.book { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1414 / 2000; perspective: 2200px; container-type: inline-size; }
.page {
  position: absolute; inset: 0; overflow: hidden; border-radius: 6px; background: var(--blue-deep);
  box-shadow: 0 18px 40px rgba(0, 0, 20, .45); transform-origin: left center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform .95s cubic-bezier(.55, .05, .2, 1), opacity .8s ease;
}
.page .art { width: 100%; height: 100%; display: block; object-fit: cover; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.page.gone.flip { transform: rotateY(-178deg); pointer-events: none; }
.page.gone.fade { opacity: 0; transform: scale(1.14); pointer-events: none; }
.page.tap { cursor: pointer; }

/* moving layers */
.lay { position: absolute; pointer-events: none; }
.lay img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; user-select: none; }
.tapx { pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tapx:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
@keyframes dance {
  0%, 100% { translate: 0 0; rotate: -5deg; } 25% { translate: 0 -22%; rotate: 4deg; }
  50% { translate: 0 0; rotate: 6deg; } 75% { translate: 0 14%; rotate: -4deg; }
}
@keyframes popspin { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.6) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
@keyframes hop { 0% { transform: none; } 35% { transform: translateY(-12%) scale(1.07) rotate(-4deg); } 70% { transform: translateY(0) scale(.97); } 100% { transform: none; } }
.dancer { animation: dance var(--t, 2.8s) ease-in-out var(--d, 0s) infinite; }
.pop img { animation: popspin .7s ease-in-out; }
.hop img { animation: hop .6s ease-out; }
@keyframes catbob { 0%, 100% { rotate: -2.5deg; translate: 0 0; } 50% { rotate: 3deg; translate: 0 -2%; } }
@keyframes catwave { 0%, 100% { rotate: -4deg; } 50% { rotate: 5deg; } }
@keyframes floaty { 0%, 100% { translate: 0 0; rotate: -2deg; } 50% { translate: 0 -4%; rotate: 2.5deg; } }
@keyframes balloonpop { to { transform: scale(1.4); opacity: 0; } }
@keyframes inflate { 0% { transform: scale(0); opacity: 1; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.cat-top { animation: catbob var(--t, 3.2s) ease-in-out var(--d, 0s) infinite; }
.cat-low { animation: catwave var(--t, 2.6s) ease-in-out var(--d, 0s) infinite; }
.floaty { animation: floaty 3.6s ease-in-out infinite; }
.popped img { animation: balloonpop .22s ease-out forwards; }
.inflate img { animation: inflate .8s ease-out; }
.say {
  position: absolute; translate: -50% -100%; background: var(--cream); color: var(--ink); font-style: italic; font-weight: 800;
  padding: .15em .7em; border-radius: 99px; font-size: clamp(12px, 4.2cqw, 20px); white-space: nowrap; pointer-events: none;
  box-shadow: 0 6px 14px rgba(30, 10, 50, .3); animation: sayup 1.3s ease-out forwards; z-index: 6;
}
@keyframes sayup { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }

/* wax seal */
.seal {
  position: absolute; left: 46.1%; top: 50.9%; width: 24%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; border: 0; padding: 0;
  background: transparent; cursor: pointer; touch-action: none; animation: ring 1.9s ease-out infinite;
}
.seal:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
.seal.crack { animation: shake .55s ease-in-out; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255, 246, 230, .75); } 100% { box-shadow: 0 0 0 5cqw rgba(255, 246, 230, 0); } }
@keyframes shake {
  0%, 100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-9deg) scale(1.06); }
  40% { transform: rotate(8deg) scale(1.08); } 60% { transform: rotate(-6deg) scale(1.05); } 80% { transform: rotate(3deg) scale(1.02); }
}

/* letters */
.pull {
  position: absolute; left: 30.5%; top: 4.5%; width: 61.5%; height: 18%; border: 0; padding: 0; background: transparent;
  cursor: grab; touch-action: none; border-radius: 6px;
}
.pull:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.chip {
  position: absolute; translate: -50% 0; z-index: 2; background: var(--cream); color: var(--ink); font-style: italic; font-weight: 600;
  font-size: clamp(12px, 3.4cqw, 16px); padding: .35em .9em; border-radius: 99px; box-shadow: 0 6px 16px rgba(60, 20, 60, .3);
  pointer-events: none; white-space: nowrap; animation: bob 1.5s ease-in-out infinite;
}
.chip.gone { opacity: 0; transition: opacity .3s; animation: none; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.letter {
  --p: 0; position: absolute; inset: 4.5% 6% 5%; z-index: 5; background: var(--paper); color: var(--ink); border-radius: 4px; padding: 11% 9% 7%;
  box-shadow: 0 20px 50px rgba(40, 10, 40, .5); display: flex; flex-direction: column; gap: 1.2em; visibility: hidden;
  opacity: min(1, calc(var(--p) * 1.7));
  transform: translateY(calc((1 - var(--p)) * 38%)) scale(calc(.72 + .28 * var(--p))) rotate(calc((1 - var(--p)) * 3deg));
  transform-origin: 70% 100%; overflow: hidden;
  --lh: 1.75em; background-image: repeating-linear-gradient(transparent 0, transparent calc(var(--lh) - 1px), rgba(35, 35, 198, .10) calc(var(--lh) - 1px), rgba(35, 35, 198, .10) var(--lh));
  font-family: var(--script); font-weight: 400; font-size: clamp(11px, 3.45cqw, 19px); line-height: var(--lh);
}
.letter.long { --lh: 1.6em; font-size: clamp(8.5px, 2.75cqw, 15px); padding: 9% 7% 5%; gap: .8em; }
.letter.long .letter-body { gap: .9em; }
.letter-body.more { -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); }
.scrollhint { align-self: center; font-family: var(--display); font-style: italic; font-weight: 600; font-size: clamp(11px, 3cqw, 14px); color: var(--blue); margin-top: -.4em; transition: opacity .3s; }
.scrollhint[hidden] { display: none; }
.letter.show { visibility: visible; }
.letter.settle { transition: transform .55s cubic-bezier(.2, .8, .2, 1), opacity .4s ease; }
.letter::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 34%; height: 28px; translate: -50% 0; rotate: -2deg; background-color: #e9a1b8;
  background-image: linear-gradient(90deg, rgba(255, 255, 255, .55) 50%, transparent 50%), linear-gradient(rgba(255, 255, 255, .55) 50%, transparent 50%);
  background-size: 14px 14px; opacity: .92;
}
.letter p { margin: 0; }
.letter .gap { color: var(--pink); }
.letter-body { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 1.2em; padding-right: 2px; }
.fold {
  align-self: center; border: 0; cursor: pointer; font-family: var(--display); font-style: italic; font-weight: 600;
  font-size: clamp(12px, 3.3cqw, 15px); color: var(--cream); background: var(--blue); padding: .55em 1.3em; border-radius: 99px;
}
.fold:focus-visible, .nav:focus-visible, .blow:focus-visible, .flame:focus-visible, .again:focus-visible, .card:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

/* candles */
.flames { position: absolute; inset: 0; pointer-events: none; }
.flame {
  position: absolute; width: 6.4%; aspect-ratio: 40 / 70; translate: -50% -96%; border: 0; padding: 0; background: transparent; cursor: pointer; pointer-events: auto;
  transform-origin: 50% 100%; filter: drop-shadow(0 0 7px rgba(255, 170, 40, .95)) drop-shadow(0 0 18px rgba(255, 130, 30, .6));
  animation: flicker 1.1s ease-in-out infinite alternate; transition: opacity .35s ease, scale .35s ease;
}
.flame::after { content: ""; position: absolute; inset: -30% -60% -10%; }
.flame svg { width: 100%; height: 100%; display: block; overflow: visible; }
.flame:nth-child(2) { animation-delay: -.3s; } .flame:nth-child(3) { animation-delay: -.6s; }
.flame:nth-child(4) { animation-delay: -.2s; } .flame:nth-child(5) { animation-delay: -.8s; }
.flame.out { opacity: 0; scale: .2; animation: none; pointer-events: none; }
@keyframes flicker { from { transform: scale(1, 1) rotate(-1.5deg); } to { transform: scale(.93, 1.08) rotate(2deg); } }
.blowing .flame:not(.out) { animation: lean .2s ease-in-out infinite alternate; }
@keyframes lean { from { transform: rotate(10deg) scale(.88, 1.1); } to { transform: rotate(24deg) scale(.78, .94); } }
.smoke {
  position: absolute; width: 4%; aspect-ratio: 1; border-radius: 50%; translate: -50% -100%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 70%); animation: rise 1.9s ease-out forwards;
}
@keyframes rise { from { opacity: .95; transform: translateY(0) scale(.5); } to { opacity: 0; transform: translateY(-1300%) translateX(40%) scale(2.6); } }
.banner {
  position: absolute; left: 50%; bottom: 6%; translate: -50% 0; width: 82%; text-align: center; background: var(--cream); color: var(--ink);
  border-radius: 14px; padding: .8em 1em; box-shadow: 0 14px 30px rgba(60, 20, 60, .35); opacity: 0; transform: translateY(24px) scale(.96); pointer-events: none;
  transition: opacity .6s ease .2s, transform .6s cubic-bezier(.2, .8, .2, 1) .2s;
}
.banner.on { opacity: 1; transform: none; pointer-events: auto; }
.banner h2 { margin: 0; font-style: italic; font-weight: 800; font-size: clamp(20px, 7.4cqw, 38px); line-height: 1.05; color: var(--blue); }
.banner p { margin: .35em 0 0; font-style: italic; font-weight: 600; font-size: clamp(12px, 3.6cqw, 17px); }
.banner button, .reclose {
  margin-top: .7em; border: 0; cursor: pointer; font: inherit; font-style: italic; font-weight: 600; font-size: clamp(12px, 3.3cqw, 15px);
  background: var(--pink); color: #fff; padding: .45em 1.2em; border-radius: 99px;
}

/* gift */
.giftwrap { position: absolute; transform-origin: 50% 100%; animation: tease 3.4s ease-in-out infinite; }
@keyframes tease {
  0%, 62%, 100% { transform: rotate(0) scale(1); } 66% { transform: rotate(-2.2deg) scale(1.02); } 70% { transform: rotate(2.2deg) scale(1.02); }
  74% { transform: rotate(-1.6deg); } 78% { transform: rotate(1.6deg); } 82% { transform: rotate(0); }
}
.giftpart { position: absolute; inset: 0; transition: transform .95s cubic-bezier(.3, .7, .2, 1), opacity .7s ease .15s; }
.giftpart img { width: 100%; height: 100%; display: block; pointer-events: none; }
.giftpart.lid { clip-path: polygon(0% 0%, 100% 0%, 100% 44.8%, 89.5% 44.8%, 64.5% 58.9%, 30.8% 58.9%, 9.9% 43.7%, 0% 43.7%); }
.giftpart.bod { clip-path: polygon(0% 43.7%, 9.9% 43.7%, 30.8% 58.9%, 64.5% 58.9%, 89.5% 44.8%, 100% 44.8%, 100% 100%, 0% 100%); transition: opacity .6s ease .5s, scale .6s ease .5s; }
.p-gift.open .giftwrap { animation: none; pointer-events: none; }
.p-gift.open .lid { transform: translate(14%, -110%) rotate(24deg); opacity: 0; }
.p-gift.open .bod { opacity: 0; scale: .9; }
.cards { position: absolute; left: 8%; right: 8%; top: 17%; bottom: 14%; display: flex; flex-direction: column; justify-content: center; gap: 6%; pointer-events: none; z-index: 4; }
.card {
  position: relative; pointer-events: none; opacity: 0; border: 0; text-align: left; font: inherit; cursor: pointer; flex: 0 0 auto;
  transform: translateY(60%) scale(.3) rotate(calc(var(--rot, -2deg) * -4)); transition: transform .8s cubic-bezier(.2, 1.2, .3, 1), opacity .4s ease;
  filter: drop-shadow(0 14px 18px rgba(10, 5, 60, .45));
}
.p-gift.open .card { opacity: 1; transform: rotate(var(--rot, -2deg)); pointer-events: auto; transition-delay: calc(.75s + var(--i, 0) * .22s); }
.p-gift.open .card:active { transform: rotate(var(--rot, -2deg)) scale(.97); transition-delay: 0s; }
.ticket { background: #fff; color: #1b1b1b; border-radius: 3.2cqw; padding: 5cqw 6cqw 5cqw 9cqw; border-left: 2.4cqw solid var(--orange); overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; right: -2.6cqw; width: 5.2cqw; height: 5.2cqw; border-radius: 50%; background: var(--blue); }
.ticket::before { top: 38%; } .ticket::after { display: none; }
.ticket small { display: block; font-style: normal; font-weight: 600; letter-spacing: .14em; font-size: 2.9cqw; color: #7a7a86; }
.ticket b { display: block; font-style: italic; font-weight: 800; font-size: 8.4cqw; line-height: 1.05; margin: 1.2cqw 0 1cqw; }
.ticket span { display: block; font-weight: 600; font-size: 4cqw; }
.ticket em { display: block; margin-top: 2.4cqw; padding-top: 2.4cqw; border-top: 1px dashed #c9c9d2; font-size: 3.6cqw; color: var(--orange); font-weight: 800; }
.plane { position: absolute; right: 8%; top: 12%; width: 9cqw; fill: var(--orange); transition: transform 1.2s ease-in, opacity 1.2s; }
.card.fly .plane { transform: translate(60cqw, -30cqw) rotate(-18deg); opacity: 0; }
.shoe { background: var(--cream); color: var(--ink); border-radius: 3.2cqw; padding: 4cqw 6cqw; display: grid; grid-template-columns: 1fr; justify-items: center; text-align: center; }
.shoe svg { width: 62%; overflow: visible; transform-origin: 20% 90%; }
.card.kick .shoe svg { animation: kick .7s ease-out; }
@keyframes kick { 0% { transform: none; } 30% { transform: rotate(-16deg) translate(-4%, -8%); } 60% { transform: rotate(7deg) translate(5%, 2%); } 100% { transform: none; } }
.shoe b { display: block; font-style: italic; font-weight: 800; font-size: 6.2cqw; line-height: 1.1; margin-top: 1.5cqw; color: var(--blue); }
.shoe span { display: block; font-weight: 600; font-size: 3.8cqw; margin-top: 1cqw; }
.reclose { position: absolute; left: 50%; bottom: 5%; translate: -50% 0; margin: 0; opacity: 0; pointer-events: none; transition: opacity .4s ease 1.5s; z-index: 5; background: var(--cream); color: var(--blue); }
.p-gift.open .reclose { opacity: 1; pointer-events: auto; }

/* love */
@keyframes beat { 0%, 100% { scale: 1; } 14% { scale: 1.09; } 28% { scale: 1; } 42% { scale: 1.055; } 70% { scale: 1; } }
@keyframes lhop { 0%, 100% { translate: 0 0; } 14% { translate: 0 -3%; } 28% { translate: 0 0; } 42% { translate: 0 -1.5%; } 70% { translate: 0 0; } }
@keyframes spin { to { rotate: 360deg; } }
@keyframes twinkle { 0%, 100% { scale: .9; } 50% { scale: 1.12; } }
.heartbeat { animation: beat 1.15s ease-in-out infinite; }
.lhop { animation: lhop 1.15s ease-in-out infinite; }
.p-love.fast .heartbeat, .p-love.fast .lhop { animation-duration: .58s; }
.shrink { animation: beat 1.15s ease-in-out var(--d, .1s) infinite; }
.star { animation: spin var(--t, 18s) linear infinite, twinkle 2.6s ease-in-out var(--d, 0s) infinite; }
.fh { position: absolute; width: 7%; aspect-ratio: 1; pointer-events: none; z-index: 6; animation: floatup 2.3s ease-out forwards; }
.fh svg { width: 100%; height: 100%; display: block; }
@keyframes floatup { 0% { transform: translate(0, 0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx, 0), -380%) scale(1.15); opacity: 0; } }

/* control bar */
.bar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 10px; min-height: 84px; }
.nav {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--cream); background: transparent; color: var(--cream);
  display: grid; place-items: center; cursor: pointer; transition: opacity .2s, background .2s;
}
.nav:hover:not(:disabled) { background: rgba(255, 246, 230, .16); }
.nav:disabled { opacity: .28; cursor: default; }
.nav svg { width: 22px; height: 22px; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; text-align: center; }
#hint { margin: 0; font-style: italic; font-weight: 600; font-size: 16px; line-height: 1.25; text-wrap: balance; }
.dots { display: flex; gap: 8px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 246, 230, .3); transition: background .3s, scale .3s; }
.dots span.on { background: var(--cream); scale: 1.3; }
.blow, .again {
  border: 0; cursor: pointer; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 17px; background: var(--pink); color: #fff;
  padding: .55em 1.5em; border-radius: 99px; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 6px 0 #b8407a; transition: transform .1s, box-shadow .1s;
}
.blow:active, .blow.held, .again:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8407a; }
.snd {
  position: absolute; top: 10px; right: 10px; z-index: 30; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--cream);
  background: rgba(23, 23, 143, .6); color: var(--cream); display: grid; place-items: center; cursor: pointer; padding: 0;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.snd svg { width: 20px; height: 20px; }
.snd .off { display: none; }
.snd.muted .on { display: none; }
.snd.muted .off { display: block; }
.snd:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (prefers-reduced-motion: reduce) {
  .page, .letter.settle, .banner, .card, .giftpart { transition-duration: .01s; transition-delay: 0s !important; }
  .seal, .chip, .flame, .dancer, .cat-top, .cat-low, .floaty, .giftwrap, .heartbeat, .lhop, .shrink, .star { animation: none; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/><stop offset=".55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
  </defs>
</svg>

<main class="wrap">
  <div class="book" id="book">
    <!-- 0 cover -->
    <section class="page flip tap" id="p0" data-hint="Tap the letters, or anywhere else to open" aria-label="Card cover">
      <img class="art" src="img/cover_base.webp" alt="Cut-paper collage of a laughing toddler in a party hat under bunting">
    </section>
    <!-- 1 happy birthday -->
    <section class="page flip" id="p1" data-hint="Tap the cats. Pop the balloons" aria-label="Happy birthday 25">
      <img class="art" src="img/birthday_base.webp" alt="Happy Birthday with cats in party hats and gold 25 balloons">
    </section>
    <!-- 2 tulips + letter -->
    <section class="page flip" id="p2" data-hint="Pull the letter up to read it" aria-label="Tulips and a letter">
      <img class="art" src="img/tulips.webp" alt="A bouquet of pink tulips beside an envelope with a letter peeking out">
      <button class="pull" id="pull" aria-label="Pull the letter out of the envelope"></button>
      <div class="chip" id="chip" style="left:61%;top:22.5%">pull up</div>
    </section>
    <!-- 3 sealed envelope -->
    <section class="page fade" id="p3" data-hint="Tap the wax seal, or pull the letter up" aria-label="Sealed envelope">
      <img class="art" src="img/envelope.webp" alt="A pink envelope closed with a rose wax seal and a lipstick kiss">
      <button class="seal" id="seal" aria-label="Break the wax seal and take out the letter"></button>
    </section>
    <!-- 4 candles -->
    <section class="page flip" id="p4" data-hint="Make a wish, then hold to blow" aria-label="Birthday cake">
      <img class="art" src="img/candles.webp" alt="A hand-drawn pink birthday cake with five candles">
      <div class="flames" id="flames"></div>
      <div class="banner" id="banner" role="status">
        <h2>Happy 25th birthday!</h2>
        <p>Every candle is out. Your wish is on its way.</p>
        <button id="relight">Light them again</button>
      </div>
    </section>
    <!-- 5 gift -->
    <section class="page flip p-gift" id="p5" data-hint="Tap the gift to open it" aria-label="Gift box">
      <img class="art" src="img/gift_base.webp" alt="Blue page with the words open me">
